name: Deploy BLE viewer

on:
  push:
    branches: [main, master]
    paths:
      - "web/bp-viewer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p _site
          rsync -a --exclude serve.py --exclude manifest.json --exclude sw.py --exclude sw.js \
            web/bp-viewer/ _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
